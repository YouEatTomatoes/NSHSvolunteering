<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSHS Volunteering</title>
    <link rel="icon" href="https://resources.finalsite.net/images/v1707236962/salkeizk12orus/d9w9j5nv9ilaayuv8lji/North_mascot_variation_sq_white.svg">
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            margin: 0;
            font-family: "Lora", serif;
            display: flex;
            flex-direction: column;
        }
        #top-banner {
            background-color: #a71b17;
            color: #ffffff;
            padding: 2px 0;           /* Adds space above and below items */
            font-size: 16px;           /* Text size */
            width: 100%;               /* Ensures it spans the full width */
            display: flex;            /* Sets alignment type */
            flex-direction: row;      /* Sets alignment horizontally */
            justify-content: center;  /* Aligns items horizontally */
            align-items: center;      /* Aligns items vertically */
            gap: 16px;            
        }
        #card-holder {
            flex: 1 0 auto; /* Forces this area to grow and push the footer down */
            padding: 20px;            
        }
        #bottom-banner {
            background-color: #000000;
            color: #9f9f9f;
            padding: 2px 0;           /* Adds space above and below items */
            font-size: 14px;           /* Text size */
            width: 100%;               /* Ensures it spans the full width */
            display: flex;
            flex-direction: row;      /* Sets alignment horizontally */
            justify-content: center;  /* Aligns items horizontally */
            align-items: center;      /* Aligns items vertically */
        }
    </style>
</head>
<body>
    <div id="top-banner">
        <img alt="True North Salem" width="70" style="padding-left: 20px;" src="https://resources.finalsite.net/images/v1707236962/salkeizk12orus/d9w9j5nv9ilaayuv8lji/North_mascot_variation_sq_white.svg">
        <h1>Volunteer Opportunities</h1>
    </div>
    <div id="card-holder"> 
        <iframe id="spreadsheet" width="100%" height="100%" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vT_8IAnok6j5eCYtc0Vvt4BsZCIsCylXRrUHGJk57QNEWZewhuMGYkWhIhxZn3jDP_sRV6u8wJX53gf/pubhtml?gid=1036228865&amp;single=true&amp;headers=false&chrome=false&widget=false"></iframe>
    </div>
    <div id="bottom-banner">
        <p style="padding: 0 20px;">To add a volunteer opportunity, <a href="https://www.google.com" target="_blank">click here,</a> or contact Ms. Green at green_amy@salkeiz.k12.or.us</p>
    </div>
    <script>
        if (/Android|Mobi|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/.test(navigator.userAgent)) {
            document.getElementById("spreadsheet").src = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_8IAnok6j5eCYtc0Vvt4BsZCIsCylXRrUHGJk57QNEWZewhuMGYkWhIhxZn3jDP_sRV6u8wJX53gf/pubhtml?gid=295699938&amp;single=true&amp;headers=false&chrome=false&widget=false";
        }
    </script>
</body>
</html>
